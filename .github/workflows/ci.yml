name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun.lock is for Bun users; the npm route (see README) builds its own lockfile.
      - run: rm -f bun.lock && npm install
      - run: npx tsc --noEmit
      - run: npm run test:node
      - run: npm run build
